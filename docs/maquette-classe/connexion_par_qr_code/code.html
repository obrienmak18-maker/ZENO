<!DOCTYPE html>

                        "secondary-container": "#fd56a7",
                        "error-container": "#ffdad6",
                        "on-primary-fixed": "#25005a",
                        "on-secondary": "#ffffff",
                        "secondary": "#b4136d",
                        "primary": "#630ed4",
                        "on-surface": "#1d1a24",
                        "surface-container-highest": "#e8dfee",
                        "outline-variant": "#ccc3d8",
                        "on-primary-fixed-variant": "#5a00c6",
                        "on-tertiary": "#ffffff",
                        "surface-dim": "#dfd7e6",
                        "surface-container-lowest": "#ffffff",
                        "error": "#ba1a1a",
                        "success": "#10B981",
                        "on-secondary-fixed-variant": "#8c0053",
                        "on-background": "#1d1a24",
                        "on-error-container": "#93000a",
                        "background": "#fef7ff",
                        "danger": "#EF4444",
                        "inverse-surface": "#332f39",
                        "tertiary-fixed-dim": "#c9c4d3",
                        "text-secondary": "#64748B",

                        "on-tertiary-fixed": "#1c1a25",
                        "on-error": "#ffffff",
                        "outline": "#7b7487",
                        "surface-bright": "#fef7ff",
                        "secondary-fixed-dim": "#ffb0cd",
                        "on-surface-variant": "#4a4455",
                        "on-secondary-fixed": "#3e0022",
                        "surface-tint": "#732ee4",
                        "primary-container": "#7c3aed",
                        "on-primary": "#ffffff",
                        "tertiary": "#4f4d59",
                        "on-tertiary-fixed-variant": "#474551",
                        "surface-container-high": "#ede5f4",
                        "tertiary-container": "#686572",

                        "inverse-primary": "#d2bbff",
                        "secondary-fixed": "#ffd9e4",
                        "inverse-on-surface": "#f6eefc"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "base": "4px",
                        "lg": "24px",
                        "xl": "32px",
                        "container-padding": "20px",
                        "xs": "8px",

                        "sm": "12px"
                    },
                    "fontFamily": {
                        "display-stats": ["Inter"],

                    "animation": {
                        'pulse-border': 'pulse-border 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    "keyframes": {
                        'pulse-border': {
                            '0%, 100%': { borderColor: 'rgba(99, 14, 212, 1)' }, // primary
                            '50%': { borderColor: 'rgba(99, 14, 212, 0.3)' },
                        }
                    }
                }
            }
        }
    </script>
<style>
        /* Hide scrollbar for a cleaner fullscreen app feel */
        body {
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        
        .camera-overlay {
            background: radial-gradient(circle at center, transparent 35%, rgba(29, 26, 36, 0.8) 100%);
        }
        
        .corner-top-left { border-top: 4px solid #630ed4; border-left: 4px solid #630ed4; border-top-left-radius: 1.5rem; }
        .corner-top-right { border-top: 4px solid #630ed4; border-right: 4px solid #630ed4; border-top-right-radius: 1.5rem; }
        .corner-bottom-left { border-bottom: 4px solid #630ed4; border-left: 4px solid #630ed4; border-bottom-left-radius: 1.5rem; }
        .corner-bottom-right { border-bottom: 4px solid #630ed4; border-right: 4px solid #630ed4; border-bottom-right-radius: 1.5rem; }
    </style>
</head>
<body class="bg-on-surface h-screen w-screen relative font-body-base text-body-base antialiased">
<!-- Simulated Camera Feed Background -->
<div class="absolute inset-0 w-full h-full z-0 overflow-hidden bg-on-surface">
<img class="w-full h-full object-cover opacity-60" data-alt="A slightly blurred, abstract view of a modern classroom interior, serving as a simulated camera background for a QR scanner. The scene is softly lit with natural daylight, showing hints of desks and a whiteboard in the distance. The overall tone is bright, functional, and aligns with a professional yet modern educational environment, using subtle lavender and white tones in the ambient light." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC3-Ixpa_EfRV1lRWzKb9Z_hBrNQKl1S9I1s889J6Tckj4P4QsyL5xRiPce3_3Xs-dR6s3oKfXqYxF_D26nSHwroKVk2F4iOv46jdZb0kzLttAFS8_6M9iZPkuNGETF8sbiGRbB4kkEtCIIyQf1u4Yg5Na2Y-VWk4jsPEeBsOz80UQCH8pBVpOBT5sOpYKr2AYSbyafO4foYr3Crx8DepYc_yruVEX4ZWwzILrUoPwJFdRcYTeoAT8ofA"/>
</div>
<!-- Gradient Overlay for Contrast -->
<div class="absolute inset-0 z-10 camera-overlay pointer-events-none"></div>
<!-- Main Content Container -->
<main class="relative z-20 h-full w-full flex flex-col items-center justify-between py-xl px-container-padding">
<!-- Top Branding -->
<header class="w-full text-center mt-md">
<h1 class="font-display-hero text-display-hero text-surface drop-shadow-md">CLASSE</h1>
<p class="font-body-lg text-body-lg text-surface-variant mt-xs opacity-90">Portail Étudiant</p>
</header>
<!-- QR Scan Zone -->
<div class="relative w-64 h-64 md:w-80 md:h-80 flex-shrink-0 my-auto group cursor-pointer" onclick="simulateScan()">
<!-- Pulsing Animation Layer -->
<div class="absolute -inset-4 border-2 border-primary rounded-3xl animate-pulse-border opacity-50 transition-opacity duration-300 group-hover:opacity-100"></div>
<!-- Structural Corners -->
<div class="absolute top-0 left-0 w-12 h-12 corner-top-left"></div>
<div class="absolute top-0 right-0 w-12 h-12 corner-top-right"></div>
<div class="absolute bottom-0 left-0 w-12 h-12 corner-bottom-left"></div>
<div class="absolute bottom-0 right-0 w-12 h-12 corner-bottom-right"></div>
<!-- Scanning Line Effect -->
<div class="absolute top-0 left-0 w-full h-0.5 bg-primary shadow-[0_0_10px_#7c3aed] animate-[scan_2s_ease-in-out_infinite] z-30" id="scan-line"></div>
<!-- Center Focus Indicator (Optional/Subtle) -->
<div class="absolute inset-0 flex items-center justify-center opacity-30">
<span class="material-symbols-outlined text-surface text-4xl">qr_code_scanner</span>
</div>
</div>
<!-- Instructional Text & Bottom Actions -->
<footer class="w-full flex flex-col items-center mb-md">
<div class="bg-surface/10 backdrop-blur-xl border border-surface/20 rounded-3xl px-lg py-md text-center max-w-sm w-full mb-lg shadow-[0px_10px_30px_rgba(99,14,212,0.2)]">
<p class="font-heading-md text-heading-md text-surface">Scannez votre QR Code pour vous connecter</p>
<p class="font-caption text-caption text-surface-variant mt-xs">Placez le code au centre du cadre</p>
</div>
<!-- Fallback Option -->
<button class="font-label-sm text-label-sm text-primary-fixed hover:text-surface transition-colors duration-200 flex items-center gap-2 px-md py-sm rounded-full hover:bg-surface/10" type="button">
<span class="material-symbols-outlined text-xl">keyboard</span>
                Saisie manuelle
            </button>
</footer>
</main>
<!-- Success Feedback Overlay (Hidden by default) -->
<div class="absolute inset-0 z-50 bg-primary/90 backdrop-blur-xl flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300" id="success-overlay">
<div class="bg-surface rounded-full p-4 mb-4 scale-50 transform transition-transform duration-500" id="success-icon-container">
<span class="material-symbols-outlined text-primary text-5xl">check_circle</span>
</div>
<h2 class="font-heading-lg text-heading-lg text-surface">Connexion réussie</h2>
<p class="font-body-base text-body-base text-primary-fixed-dim mt-2">Redirection en cours...</p>
</div>
<style>
        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
    </style>
<script>
        function simulateScan() {
            // Stop scanning animation
            document.getElementById('scan-line').style.display = 'none';
            
            // Show success overlay
            const overlay = document.getElementById('success-overlay');
            const iconContainer = document.getElementById('success-icon-container');
            
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            overlay.classList.add('opacity-100');
            
            setTimeout(() => {
                iconContainer.classList.remove('scale-50');
                iconContainer.classList.add('scale-100');
            }, 50);
            
            // Simulate redirect after delay
            setTimeout(() => {
                // Reset for demo purposes
                overlay.classList.add('opacity-0', 'pointer-events-none');
                overlay.classList.remove('opacity-100');
                iconContainer.classList.remove('scale-100');
                iconContainer.classList.add('scale-50');
                document.getElementById('scan-line').style.display = 'block';
            }, 2500);
        }
    </script>
</body></html>
